[package]
name = "resid-datastar"
version = "0.1.0"
root = "src/datastar.resid"
description = "A Datastar server SDK for Resid, and a live web UI for package registries"
license = "MIT"
repository = "https://github.com/larrydewey/resid-datastar"

# The SDK is pure: no capabilities. The registry UI (ui/registry.resid)
# grants itself what it uses from its own main: args, filesystem (the
# port file; the registry is only read) and network(readonly).
[capabilities]
grant = []

# JSON for the signals. src/datastar.resid imports them by package name
# (`import "resid-json/json.resid";`), resolved through these entries.
[dependencies.resid-json]
path = "../resid-json"
version = "0.1.0"

[dependencies.resid-serial]
path = "../resid-serial"
version = "0.1.0"

# The registry UI reads manifests through resid-toml.
[dependencies.resid-toml]
path = "../resid-toml"
version = "0.1.0"
